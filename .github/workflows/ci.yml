name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jesan
          # Throwaway credentials for the CI-only database; not a real secret.
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: jesan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jesan -d jesan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jesan:ci_only_password@localhost:5432/jesan_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations to an empty database
        run: npm run db:deploy
      - name: Check that migrations match the Prisma schema
        run: npm run db:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
